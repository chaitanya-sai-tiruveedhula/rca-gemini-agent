<!DOCTYPE html>
<html>
<head>
  <title>RCA AI Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>RCA & Problem Management AI</h1>
</header>

<div class="container">

  <div class="card input-card">
    <h2>Incident Input</h2>
    <textarea id="incident" placeholder="Describe the incident, symptoms, and affected services"></textarea>
    <button onclick="analyze()">Analyze Incident</button>
    <div id="error" class="error"></div>
  </div>

  <div class="grid">

    <div class="card">
      <h2>Similar Incidents</h2>
      <div id="similar"></div>
    </div>

    <div class="card">
      <h2>AI Root Cause Analysis</h2>
      <div id="rca"></div>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
